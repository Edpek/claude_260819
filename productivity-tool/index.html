<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>포커스 타이머</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b;
    --text:#e8eaed; --sub:#8a8f98; --accent:#ff6b4a; --accent2:#4ade80;
    --border:#2a2e38;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .app{width:100%; max-width:440px;}
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:20px;
    padding:32px; margin-bottom:20px; box-shadow:0 20px 50px rgba(0,0,0,.35);
  }
  .modes{display:flex; gap:8px; margin-bottom:28px;}
  .modes button{
    flex:1; padding:10px; border-radius:10px; border:1px solid var(--border);
    background:var(--panel2); color:var(--sub); font-size:13px; cursor:pointer;
    transition:.15s;
  }
  .modes button.active{background:var(--accent); color:#1a0f0a; border-color:var(--accent); font-weight:600;}
  .timer{
    text-align:center; font-size:76px; font-weight:700; letter-spacing:-2px;
    font-variant-numeric:tabular-nums; margin:12px 0 28px;
  }
  .controls{display:flex; gap:10px; justify-content:center;}
  .controls button{
    padding:12px 28px; border-radius:12px; border:none; font-size:15px; font-weight:600;
    cursor:pointer; transition:.15s;
  }
  #startBtn{background:var(--accent); color:#1a0f0a;}
  #startBtn:hover{filter:brightness(1.08);}
  #resetBtn{background:var(--panel2); color:var(--text); border:1px solid var(--border);}
  #resetBtn:hover{background:#252a34;}
  .sessions{text-align:center; margin-top:18px; color:var(--sub); font-size:13px;}
  h2{font-size:15px; color:var(--sub); margin-bottom:14px; font-weight:600;}
  .todo-input{display:flex; gap:8px; margin-bottom:16px;}
  .todo-input input{
    flex:1; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
    background:var(--panel2); color:var(--text); font-size:14px; outline:none;
  }
  .todo-input input:focus{border-color:var(--accent);}
  .todo-input button{
    padding:12px 18px; border-radius:10px; border:none; background:var(--accent2);
    color:#0a1a0f; font-weight:700; cursor:pointer;
  }
  ul#list{list-style:none;}
  ul#list li{
    display:flex; align-items:center; gap:10px; padding:12px 4px;
    border-bottom:1px solid var(--border); font-size:14px;
  }
  ul#list li:last-child{border-bottom:none;}
  ul#list li.done span.txt{text-decoration:line-through; color:var(--sub);}
  ul#list li .check{
    width:20px; height:20px; border-radius:6px; border:2px solid var(--border);
    cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:13px; color:transparent;
  }
  ul#list li.done .check{background:var(--accent2); border-color:var(--accent2); color:#0a1a0f;}
  ul#list li .txt{flex:1; word-break:break-word;}
  ul#list li .del{color:var(--sub); cursor:pointer; font-size:16px; padding:2px 6px;}
  ul#list li .del:hover{color:var(--accent);}
  .empty{color:var(--sub); font-size:13px; text-align:center; padding:20px 0;}
</style>
</head>
<body>
<div class="app">
  <div class="card">
    <div class="modes">
      <button class="active" data-min="25" data-mode="work">집중 25분</button>
      <button data-min="5" data-mode="short">짧은 휴식 5분</button>
      <button data-min="15" data-mode="long">긴 휴식 15분</button>
    </div>
    <div class="timer" id="timer">25:00</div>
    <div class="controls">
      <button id="startBtn">시작</button>
      <button id="resetBtn">리셋</button>
    </div>
    <div class="sessions" id="sessionCount">완료한 집중 세션: 0</div>
  </div>

  <div class="card">
    <h2>할 일 목록</h2>
    <div class="todo-input">
      <input type="text" id="todoInput" placeholder="할 일을 입력하고 Enter" maxlength="200">
      <button id="addBtn">추가</button>
    </div>
    <ul id="list"></ul>
    <div class="empty" id="emptyMsg" style="display:none;">할 일이 없습니다. 위에 추가해보세요.</div>
  </div>
</div>

<script>
(function(){
  // ---- Timer ----
  let totalSeconds = 25*60;
  let remaining = totalSeconds;
  let running = false;
  let intervalId = null;
  let sessionCount = parseInt(localStorage.getItem('focus_sessions') || '0', 10);

  const timerEl = document.getElementById('timer');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const modeButtons = document.querySelectorAll('.modes button');
  const sessionCountEl = document.getElementById('sessionCount');
  let currentMode = 'work';

  function render(){
    const m = Math.floor(remaining/60).toString().padStart(2,'0');
    const s = (remaining%60).toString().padStart(2,'0');
    timerEl.textContent = m+':'+s;
    document.title = (running ? m+':'+s+' - ' : '') + '포커스 타이머';
  }
  function updateSessionLabel(){
    sessionCountEl.textContent = '완료한 집중 세션: ' + sessionCount;
  }

  modeButtons.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(running) return;
      modeButtons.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
      totalSeconds = parseInt(btn.dataset.min,10)*60;
      remaining = totalSeconds;
      render();
    });
  });

  function tick(){
    remaining--;
    if(remaining <= 0){
      clearInterval(intervalId);
      running = false;
      startBtn.textContent = '시작';
      if(currentMode === 'work'){
        sessionCount++;
        localStorage.setItem('focus_sessions', sessionCount);
        updateSessionLabel();
      }
      remaining = 0;
      render();
      try{
        const ctx = new (window.AudioContext||window.webkitAudioContext)();
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 880; g.gain.value = 0.15;
        o.start(); setTimeout(()=>{o.stop(); ctx.close();}, 400);
      }catch(e){}
      remaining = totalSeconds;
      render();
      return;
    }
    render();
  }

  startBtn.addEventListener('click', ()=>{
    if(running){
      running = false;
      clearInterval(intervalId);
      startBtn.textContent = '시작';
    } else {
      running = true;
      startBtn.textContent = '일시정지';
      intervalId = setInterval(tick, 1000);
    }
  });

  resetBtn.addEventListener('click', ()=>{
    running = false;
    clearInterval(intervalId);
    startBtn.textContent = '시작';
    remaining = totalSeconds;
    render();
  });

  updateSessionLabel();
  render();

  // ---- Todo list ----
  const STORAGE_KEY = 'focus_todos';
  let todos = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  const listEl = document.getElementById('list');
  const inputEl = document.getElementById('todoInput');
  const addBtn = document.getElementById('addBtn');
  const emptyMsg = document.getElementById('emptyMsg');

  function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(todos)); }

  function renderTodos(){
    listEl.innerHTML = '';
    emptyMsg.style.display = todos.length ? 'none' : 'block';
    todos.forEach((t, i)=>{
      const li = document.createElement('li');
      if(t.done) li.classList.add('done');
      const check = document.createElement('div');
      check.className = 'check';
      check.textContent = '✓';
      check.addEventListener('click', ()=>{
        todos[i].done = !todos[i].done;
        save(); renderTodos();
      });
      const span = document.createElement('span');
      span.className = 'txt';
      span.textContent = t.text;
      const del = document.createElement('span');
      del.className = 'del';
      del.textContent = '✕';
      del.addEventListener('click', ()=>{
        todos.splice(i,1);
        save(); renderTodos();
      });
      li.appendChild(check); li.appendChild(span); li.appendChild(del);
      listEl.appendChild(li);
    });
  }

  function addTodo(){
    const val = inputEl.value.trim();
    if(!val) return;
    todos.push({text:val, done:false});
    inputEl.value = '';
    save(); renderTodos();
  }

  addBtn.addEventListener('click', addTodo);
  inputEl.addEventListener('keydown', (e)=>{ if(e.key==='Enter') addTodo(); });

  renderTodos();
})();
</script>
</body>
</html>
